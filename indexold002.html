<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rommel C. Endaya | Portfolio</title>

    <!--quotable quotes-->
    <script>
      //code thanks to Asaolu Elijah!
      const url = 'https://api.quotable.io/random';

      function generateQuote() {
        fetch(url)
          .then(function (data) {
            return data.json();
          })
          .then(function (data) {
            document.getElementById('quote').innerHTML =
              '"' + data.content + '"';
            document.getElementById('author').innerHTML = data.author;
          })
          .catch(function (err) {
            console.log(err);
          });
      }
      // Repeat generateQuote() every 60 seconds
      //Note - 60000 milliseconds = 60

      //setInterval(generateQuote(), 60000);

      generateQuote();
    </script>

    <!--ISP details-->
    <script>
      const apiurl = 'https://api.techniknews.net/ipgeo/';

      function generateispdetail() {
        fetch(apiurl)
          .then(function (ispdata) {
            return ispdata.json();
          })
          .then(function (ispdata) {
            document.getElementById('country').innerHTML =
              'Country: ' + ispdata.country;
            document.getElementById('region').innerHTML =
              'Region : ' + ispdata.regionName;
            document.getElementById('city').innerHTML =
              'City   : ' + ispdata.city;
            document.getElementById('zipcode').innerHTML =
              'Zip Code : ' + ispdata.zip;
            document.getElementById('timezone').innerHTML =
              'Time Zone   : ' + ispdata.timezone;
            document.getElementById('isp').innerHTML = 'ISP   : ' + ispdata.isp;
            document.getElementById('ipaddress').innerHTML =
              'IP address   : ' + ispdata.ip;
            document.getElementById('reverse').innerHTML =
              'reverse IP   : ' + ispdata.reverse;
          })
          .catch(function (err) {
            console.log(err);
          });
      }

      generateispdetail();
    </script>

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital@1&family=Racing+Sans+One&family=Roboto&family=Roboto+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" type="text/css" href="index.css" />
  </head>

  <body>
    <div class="bodywrapper">
      <header class="mainheader"></header>
    </div>

    <script>
      var visitCount = localStorage.getItem('page_view');
      var counterContainer = document.getElementById('visits');

      function checkvisit() {
        // Check if page_view entry is present
        if (visitCount) {
          visitCount = Number(visitCount) + 1;

          localStorage.setItem('page_view', visitCount);
        } else {
          visitCount = 1;
          localStorage.setItem('page_view', 1);
        }
        counterContainer.innerText =
          'You visited my page ' + visitCount + ' times.';
      }
      checkvisit();
    </script>
  </body>
</html>
